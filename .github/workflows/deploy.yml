# Publica o site na HostGator a cada push na main.
# Gera ./dist, roda os testes e envia por FTP só o que mudou.
# Secrets: FTP_SERVER, FTP_USERNAME, FTP_PASSWORD (conta FTP com diretório public_html). Variables: SITE_URL (opcionais GOOGLE_PROFILE_URL, FTP_DIR).
name: Deploy HostGator

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-hostgator
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Build
        run: node build.mjs
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          GOOGLE_PROFILE_URL: ${{ vars.GOOGLE_PROFILE_URL }}
          GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}

      - name: Testes
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.63.0
          npx playwright install --with-deps chromium
          node tests/check.cjs

      - name: Enviar por FTP
        uses: SamKirkland/FTP-Deploy-Action@8e83cea8672e3fbcbb9fdafff34debf6ae4c5f65 # v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          security: loose
          local-dir: ./dist/
          server-dir: ${{ vars.FTP_DIR || './' }}
