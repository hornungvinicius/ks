# Temporário: lista as pastas do FTP para achar a raiz do site. Remover depois.
name: Diagnóstico FTP
on:
  push:
    branches: [claude/wizardly-planck-crfrf8]
    paths: [.github/workflows/ftp-diagnostico.yml]
jobs:
  listar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp
      - name: Listar pastas
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -u "$FTP_USERNAME,$FTP_PASSWORD" "$FTP_SERVER" -e "
            set ftp:ssl-force true; set ftp:ssl-protect-data true; set ssl:verify-certificate no;
            echo '== pwd'; pwd;
            echo '== raiz'; cls -la;
            echo '== public_html'; cls -la public_html;
            echo '== pastas (2 níveis)'; find --maxdepth=2 . ;
            bye" 2>&1 | grep -v -E '/assets/img/|/assets/fonts/' | head -300
      - name: Resposta do site
        run: |
          for p in / /robots.txt; do echo "$p $(curl -s -o /dev/null -w '%{http_code}' http://ksadvocaciaempresarial.com.br$p)"; done
